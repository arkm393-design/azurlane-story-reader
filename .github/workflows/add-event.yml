# Adds a story to the site, rebuilds or removes one, or finds story IDs. Run it from the Actions tab.
# The art processing runs here on GitHub's machines; the result is committed and the site redeployed.
name: Add or update a story

on:
  workflow_dispatch:
    inputs:
      action:
        description: "find: search story titles · add · rebuild · remove"
        type: choice
        options: [find, add, rebuild, remove]
        default: find
      story:
        description: "Story ID for add, rebuild or remove; words from the title for find"
        required: true
      update:
        description: Fetch the latest game data and art first
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stories
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install tools
        run: |
          command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -yq ffmpeg)
          pip install -q -r pipeline/requirements.txt

      # Game data, downloaded art and source clones carry over between runs.
      - uses: actions/cache@v4
        with:
          path: cache
          key: sources-${{ github.run_id }}
          restore-keys: sources-

      - name: Find stories
        if: inputs.action == 'find'
        env:
          WORDS: ${{ inputs.story }}
          UPDATE: ${{ inputs.update && '--update' || '' }}
        run: |
          # shellcheck disable=SC2086
          python3 -I pipeline/build.py list $WORDS $UPDATE | tee found.txt
          { echo '### Stories matching "'"$WORDS"'"'; echo; echo '`*` = already on the site'; echo; echo '```'; cat found.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        if: inputs.action != 'find'
        env:
          ACTION: ${{ inputs.action }}
          STORY: ${{ inputs.story }}
          UPDATE: ${{ inputs.update && '--update' || '' }}
        run: |
          case "$STORY" in (*[!0-9]*|'') echo "Story must be a number (use find to look it up)"; exit 1;; esac
          # shellcheck disable=SC2086
          python3 -I pipeline/build.py "$ACTION" "$STORY" $UPDATE | tee build.txt
          { echo "### $ACTION $STORY"; echo; echo '```'; tail -n 60 build.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit
        id: commit
        if: inputs.action != 'find'
        env:
          ACTION: ${{ inputs.action }}
          STORY: ${{ inputs.story }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site pipeline/state config
          if git diff --cached --quiet; then echo "Nothing changed."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          title=$(python3 -c "import json;print(next((e['title'] for e in json.load(open('site/data/catalog.json'))['events'] if e['id']==$STORY),''))")
          git commit -q -m "Story $ACTION: $STORY ${title}" -m "Built by the Add or update a story workflow."
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Commits pushed by a workflow don't start other workflows, so the deploy is called directly.
  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
