# Tests the sync service on every change, and deploys it to Cloudflare once the D1_DATABASE_ID variable is set.
name: Sync service

on:
  push:
    branches: [main]
    paths: ['worker/**', 'site/sync-core.js', '.github/workflows/sync-worker.yml']
  pull_request:
    paths: ['worker/**', 'site/sync-core.js', '.github/workflows/sync-worker.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --no-warnings --test worker/test/worker.test.mjs

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.D1_DATABASE_ID != ''
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4.131.2
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fill in settings
        env:
          D1_ID: ${{ vars.D1_DATABASE_ID }}
          ORIGINS: ${{ vars.SITE_ORIGIN }}
        run: sed -i "s|__D1_DATABASE_ID__|$D1_ID|; s|__ALLOWED_ORIGINS__|$ORIGINS|" wrangler.toml
      - name: Create tables (safe to repeat)
        run: $WRANGLER d1 execute alsr-sync --remote --file schema.sql
      - name: Deploy
        run: $WRANGLER deploy
      - name: Set the key pepper
        env:
          KEY_PEPPER: ${{ secrets.KEY_PEPPER }}
        run: |
          if [ -z "$KEY_PEPPER" ]; then echo "::warning::KEY_PEPPER secret is not set; sync keys are hashed without it."; exit 0; fi
          printf '%s' "$KEY_PEPPER" | $WRANGLER secret put KEY_PEPPER
